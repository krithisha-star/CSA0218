function gg(){modal(`<h3>Sign in with Google</h3><p class=mu sm>Demo: enter any Google email to continue.</p><form onsubmit="return A.gg(event)"><input name=email type=email placeholder="you@gmail.com" required><div class=ra><button type=button class="btn o" onclick=cm()>Cancel</button><button class=btn>Continue</button></div></form>`);A.gg=e=>{const em=fd(e).email.toLowerCase();let u=D.users.find(x=>x.email==em);if(!u){u={id:Date.now(),name:em.split('@')[0],email:em,phone:'',pw:hs(Math.random()+''),role:'user',on:1,ver:1,addr:''};D.users.push(u);sv()}if(!u.on)return toast('Account deactivated','err');cm();doLogin(u,0);return false}}
V.dashboard=()=>{const o=mine(),ok=o.filter(x=>x.status!='Cancelled'),paid=ok.filter(x=>x.pay=='Paid'),un=ok.filter(x=>x.pay=='Unpaid'),low=D.products.filter(p=>p.stock<=D.set.low),wk=[...Array(7)].map((_,i)=>{const d=dt(6-i);return[d.slice(5),paid.filter(x=>x.date==d).reduce((a,x)=>a+x.total,0)]});
return`<div class=card><h2 style="margin-top:0">Welcome back, ${esc(U.name)} 👋</h2><p class=mu>Here is what is happening at ${esc(D.set.store)}.</p><div class=fl style="margin:0"><a class=btn href="#new-bill">+ New Bill</a><a class="btn o" href="#products">Products</a><a class="btn o" href="#payments">Payments</a><a class="btn o" href="#reports">Reports</a></div></div>
<div class=g>${[['Revenue (paid)',inr(paid.reduce((a,x)=>a+x.total,0))],['Total orders',o.length],['Pending payments',inr(un.reduce((a,x)=>a+x.total,0))],['Low-stock items',low.length]].map(s=>`<div class="card st"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div>
<div class="g g2"><div class=card><h3 style="margin-top:0">Revenue – last 7 days</h3>${bars(wk)}</div><div class=card><h3 style="margin-top:0">Alerts</h3>${un.length?`<p>⚠ ${un.length} unpaid bill(s) need follow-up.</p>`:''}${low.map(p=>`<p>📉 Low stock: ${esc(p.name)} (${p.stock} left)</p>`).join('')||'<p class=mu>Stock levels look fine.</p>'}</div></div>
<div class="g g2"><div class=card><h3 style="margin-top:0">Recent transactions</h3><div class=w><table>${[...o].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(x=>`<tr><td><a href="#orders" onclick="setTimeout(()=>inv('${x.id}'),60)">${x.id}</a></td><td>${esc(x.cust)}</td><td>${inr(x.total)}</td><td>${tg(x.pay)}</td></tr>`).join('')}</table></div></div><div class=card><h3 style="margin-top:0">Recent activity</h3>${D.logs.filter(l=>U.role=='admin'||l.u==U.name).slice(0,6).map(l=>`<p class=sm><b>${esc(l.u)}</b> · ${esc(l.a)}<br><span class=mu>${l.t}</span></p>`).join('')||'<p class=mu>No activity yet.</p>'}</div></div>`};
V.orders=()=>{AF=ot;return`${hd('Orders','<a class=btn href="#new-bill">+ New Bill</a>')}<div class=card><div class=fl><input id=q placeholder="Search order or customer" oninput=ot()><select id=fs onchange=ot()><option value="">All status</option>${ST.map(s=>`<option>${s}</option>`).join('')}</select><select id=so onchange=ot()><option value=d>Newest first</option><option value=h>Highest amount</option><option value=l>Lowest amount</option></select><button class="btn o" onclick="csv([['Order','Customer','Date','Total','Status','Payment'],...mine().map(o=>[o.id,o.cust,o.date,o.total.toFixed(2),o.status,o.pay])],'Orders export')">Export</button></div><div class=w><table><thead><tr><th>Order<th>Customer<th>Date<th>Total<th>Status<th>Payment<th></tr></thead><tbody id=tb></tbody></table></div></div>`};
function ot(){const q=$('#q').value.toLowerCase(),s=$('#fs').value,so=$('#so').value,r=mine().filter(o=>(o.id+o.cust).toLowerCase().includes(q)&&(!s||o.status==s));r.sort((a,b)=>so=='h'?b.total-a.total:so=='l'?a.total-b.total:b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
$('#tb').innerHTML=r.map(o=>`<tr><td>${o.id}<td>${esc(o.cust)}<td>${o.date}<td>${inr(o.total)}<td><select onchange="ost('${o.id}',this.value)">${ST.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select><td>${tg(o.pay)}<td style="white-space:nowrap"><button class="btn s o" onclick="inv('${o.id}')">View</button> ${U.role=='admin'?`<button class="btn s d" onclick="ask('Delete order ${o.id}?',()=>{D.orders=D.orders.filter(x=>x.id!='${o.id}');log('Deleted ${o.id}');sv();ot()})">✕</button>`:''}</tr>`).join('')||'<tr><td colspan=7 class=mu>No orders found</tr>'}
function ost(id,s){const o=D.orders.find(x=>x.id==id);if(s=='Cancelled'&&o.status!='Cancelled')o.items.forEach(i=>{const p=D.products.find(x=>x.id==i.id);if(p)p.stock+=i.qty});o.status=s;note(o.uid,`Order ${id} is now ${s}`,s=='Cancelled'?'warn':'ok');log(`Order ${id} → ${s}`);sv();toast('Status updated')}
function inv(id){const o=D.orders.find(x=>x.id==id);if(!o)return;modal(`<div class=rw><h2 style="margin:0">🛒 ${esc(D.set.store)}</h2><div class=tt><b>INVOICE ${o.id}</b><br>${o.date}</div></div><p>Bill to: <b>${esc(o.cust)}</b> · ${esc(o.phone)}</p><div class=w><table><tr><th>Item<th>Qty<th>Price<th>Amount</tr>${o.items.map(i=>`<tr><td>${esc(i.name)}<td>${i.qty}<td>${inr(i.price)}<td>${inr(i.price*i.qty)}</tr>`).join('')}</table></div><div class=tt>Subtotal: ${inr(o.sub)}<br>Discount (${o.dp}%): −${inr(o.disc)}<br>GST: ${inr(o.tax)}<br><b style="font-size:20px">Total: ${inr(o.total)}</b></div><p>Payment: ${tg(o.pay)} via ${o.method} · Order: ${tg(o.status)}</p><div class="ra np"><button class="btn o" onclick=cm()>Close</button><button class=btn onclick="window.print()">Print / Save PDF</button></div>`)}
V['new-bill']=()=>{CT=[];AF=rc;return`${hd('Create New Bill')}<div class="g g2"><div class=card><h3 style="margin-top:0">Customer & items</h3><label>Customer name</label><input id=cn><label>Phone (10 digits)</label><input id=cp maxlength=10><label>Product</label><div class=rw style="flex-wrap:nowrap"><select id=ps>${D.products.filter(p=>p.stock>0).map(p=>`<option value=${p.id}>${esc(p.name)} – ${inr(p.price)} (${p.stock} left)</option>`).join('')}</select><input id=pq type=number min=1 value=1 style="width:80px"><button class=btn onclick=addc()>Add</button></div></div><div class=card><h3 style="margin-top:0">Bill summary</h3><div id=ct></div><div class=fl><div><label>Discount %</label><input id=dp type=number min=0 max=50 value=0 oninput=rc()></div><div><label>Method</label><select id=pm><option>Cash<option>UPI<option>Card</select></div><div><label>Payment</label><select id=pst><option>Paid<option>Unpaid</select></div></div><button class="btn fw" onclick=gen()>Generate Invoice</button></div></div>`};
function addc(){const p=D.products.find(x=>x.id==$('#ps').value),q=+$('#pq').value,c=CT.find(x=>x.id==p.id),n=(c?c.qty:0)+q;if(!(q>0))return toast('Enter a valid quantity','err');if(n>p.stock)return toast(`Only ${p.stock} in stock`,'err');c?c.qty=n:CT.push({id:p.id,name:p.name,price:p.price,qty:q});rc()}
function rc(){const d=Math.min(50,Math.max(0,+$('#dp').value||0)),c=calc(CT,d);$('#ct').innerHTML=CT.length?`<div class=w><table>${CT.map((i,k)=>`<tr><td>${esc(i.name)}<td>×${i.qty}<td>${inr(i.price*i.qty)}<td><button class="btn s d" onclick="CT.splice(${k},1);rc()">✕</button></tr>`).join('')}</table></div><div class=tt>Subtotal ${inr(c.sub)} · Discount −${inr(c.disc)} · GST ${D.set.tax}% ${inr(c.tax)}<br><b style="font-size:20px">Total ${inr(c.total)}</b></div>`:'<p class=mu>No items added yet.</p>'}
function gen(){const n=$('#cn').value.trim(),ph=$('#cp').value.trim();if(n.length<2)return toast('Enter customer name','err');if(!/^\d{10}$/.test(ph))return toast('Enter a 10-digit phone number','err');if(!CT.length)return toast('Add at least one item','err');const dp=Math.min(50,Math.max(0,+$('#dp').value||0)),id='ORD-'+(Math.max(1000,...D.orders.map(o=>+o.id.slice(4)))+1);
D.orders.push({id,uid:U.id,cust:n,phone:ph,date:dt(0),items:CT.map(i=>({...i})),dp,...calc(CT,dp),status:'Pending',pay:$('#pst').value,method:$('#pm').value});CT.forEach(i=>{const p=D.products.find(x=>x.id==i.id);p.stock-=i.qty;if(p.stock<=D.set.low)note(U.id,`Low stock: ${p.name} (${p.stock} left)`,'warn')});note(U.id,'Invoice '+id+' created','ok');log('Created bill '+id);sv();toast('Invoice generated');location.hash='orders';setTimeout(()=>inv(id),80)}
V.products=()=>{AF=prt;return`${hd('Products','<button class=btn onclick=pf()>+ Add product</button>')}<div class=card><div class=fl><input id=q placeholder="Search products" oninput=prt()><select id=fc onchange=prt()><option value="">All categories</option>${cats().map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id=so onchange=prt()><option value=n>Name A–Z</option><option value=p>Price: high to low</option><option value=s>Stock: low to high</option></select></div><div class=w><table><thead><tr><th>Product<th>Category<th>Price<th>Stock<th></tr></thead><tbody id=tb></tbody></table></div></div>`};
function prt(){const q=$('#q').value.toLowerCase(),c=$('#fc').value,so=$('#so').value,r=D.products.filter(p=>p.name.toLowerCase().includes(q)&&(!c||p.cat==c));r.sort((a,b)=>so=='p'?b.price-a.price:so=='s'?a.stock-b.stock:a.name.localeCompare(b.name));$('#tb').innerHTML=r.map(p=>`<tr><td>${esc(p.name)}<td>${esc(p.cat)}<td>${inr(p.price)}<td>${p.stock<=D.set.low?`<span class="tag r">${p.stock} low</span>`:p.stock}<td style="white-space:nowrap"><button class="btn s o" onclick=pf(${p.id})>Edit</button> ${U.role=='admin'?`<button class="btn s d" onclick="ask('Delete ${esc(p.name)}?',()=>{D.products=D.products.filter(x=>x.id!=${p.id});log('Deleted product');sv();prt()})">✕</button>`:''}</tr>`).join('')||'<tr><td colspan=5 class=mu>No products found</tr>'}
function pf(id){const p=id?D.products.find(x=>x.id==id):{name:'',cat:'',price:'',stock:''};modal(`<h3>${id?'Edit':'Add'} product</h3><form onsubmit="return A.prod(event,${id||0})"><label>Name</label><input name=name value="${esc(p.name)}" required><label>Category</label><input name=cat list=cl value="${esc(p.cat)}" required><datalist id=cl>${cats().map(c=>`<option>${esc(c)}`).join('')}</datalist><label>Price (₹)</label><input name=price type=number step=0.01 min=0.01 value="${p.price}" required><label>Stock</label><input name=stock type=number min=0 value="${p.stock}" required><div class=ra><button type=button class="btn o" onclick=cm()>Cancel</button><button class=btn>Save</button></div></form>`)}
V.payments=()=>{AF=pyt;const o=mine().filter(x=>x.status!='Cancelled'),m={};o.filter(x=>x.pay=='Paid').forEach(x=>m[x.method]=(m[x.method]||0)+x.total);return`${hd('Payments & Transactions')}<div class=g><div class="card st"><span>Collected</span><b>${inr(o.filter(x=>x.pay=='Paid').reduce((a,x)=>a+x.total,0))}</b></div><div class="card st"><span>Pending</span><b>${inr(o.filter(x=>x.pay=='Unpaid').reduce((a,x)=>a+x.total,0))}</b></div>${['Cash','UPI','Card'].map(k=>`<div class="card st"><span>${k} payments</span><b>${inr(m[k])}</b></div>`).join('')}</div><div class=card><div class=fl><select id=pf onchange=pyt()><option value="">All bills</option><option>Paid<option>Unpaid</select></div><div class=w><table><thead><tr><th>Bill<th>Customer<th>Date<th>Method<th>Amount<th>Status<th></tr></thead><tbody id=tb></tbody></table></div></div>`};
function pyt(){$('#tb').innerHTML=mine().filter(o=>o.status!='Cancelled'&&(!$('#pf').value||o.pay==$('#pf').value)).sort((a,b)=>b.date.localeCompare(a.date)).map(o=>`<tr><td>${o.id}<td>${esc(o.cust)}<td>${o.date}<td>${o.method}<td>${inr(o.total)}<td>${tg(o.pay)}<td style="white-space:nowrap">${o.pay=='Unpaid'?`<button class="btn s" onclick="pay('${o.id}')">Mark paid</button> <button class="btn s o" onclick="rem('${o.id}')">Remind</button>`:`<button class="btn s o" onclick="inv('${o.id}')">Receipt</button>`}</tr>`).join('')||'<tr><td colspan=7 class=mu>No transactions</tr>'}
const pay=id=>{const o=D.orders.find(x=>x.id==id);o.pay='Paid';note(o.uid,`Payment received for ${id}`,'ok');log('Payment received '+id);sv();toast('Marked as paid');R()},rem=id=>{const o=D.orders.find(x=>x.id==id);note(o.uid,`Payment reminder: ${id} – ${inr(o.total)} pending`,'warn');sv();toast('Reminder added to notifications')};
V.reports=()=>{AF=rp;return`${hd('Reports & Analytics',`<select id=rpd onchange=rp() style="width:auto"><option value=d>Daily (7 days)<option value=w>Weekly (4 weeks)<option value=m>Monthly (6 months)</select>`)}<div id=rb></div>`};
function rp(){const k=$('#rpd').value,o=mine().filter(x=>x.status!='Cancelled'),paid=o.filter(x=>x.pay=='Paid'),b=[];
if(k=='d')for(let i=6;i>=0;i--){const d=dt(i);b.push([d.slice(5),paid.filter(x=>x.date==d).reduce((a,x)=>a+x.total,0)])}
if(k=='w')for(let i=3;i>=0;i--)b.push(['W-'+i,paid.filter(x=>x.date<=dt(i*7)&&x.date>dt(i*7+7)).reduce((a,x)=>a+x.total,0)]);
if(k=='m')for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const m=d.toISOString().slice(0,7);b.push([m.slice(2),paid.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.total,0)])}
const tp={};o.forEach(x=>x.items.forEach(i=>tp[i.name]=(tp[i.name]||0)+i.qty));const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5),tot=b.reduce((a,x)=>a+x[1],0);window._rb=b;
$('#rb').innerHTML=`<div class="g g2"><div class=card><h3 style="margin-top:0">Revenue</h3>${bars(b)}<p>Total: <b>${inr(tot)}</b> · Orders: ${o.length} · Avg bill: ${inr(o.length?o.reduce((a,x)=>a+x.total,0)/o.length:0)}</p></div><div class=card><h3 style="margin-top:0">Top selling products</h3><table>${top.map(t=>`<tr><td>${esc(t[0])}<td>${t[1]} sold</tr>`).join('')}</table><h3>Orders by status</h3>${ST.map(s=>`<p style="margin:2px 0">${tg(s)} ${mine().filter(x=>x.status==s).length}</p>`).join('')}</div></div><div class="fl np"><button class="btn o" onclick="csv([['Period','Revenue'],..._rb.map(x=>[x[0],x[1].toFixed(2)])],'Revenue report')">Export Excel (CSV)</button><button class=btn onclick="window.print()">Download PDF</button></div>`}
V.notifications=()=>{const n=D.notifs.filter(x=>x.uid==U.id);return`${hd('Notifications',`<span><button class="btn o s" onclick="D.notifs.forEach(n=>n.uid==U.id&&(n.r=1));sv();R()">Mark all read</button> <button class="btn o s" onclick="D.notifs=D.notifs.filter(n=>n.uid!=U.id);sv();R()">Clear all</button></span>`)}<div class=card>${n.map(x=>`<div class="nt ${x.r?'':'u'}"><span>${{ok:'✅',warn:'⚠️',info:'ℹ️'}[x.ty]} ${esc(x.m)}<br><span class="mu sm">${x.t}</span></span>${x.r?'':`<button class="btn s o" onclick="D.notifs.find(n=>n.id==${x.id}).r=1;sv();R()">Mark read</button>`}</div>`).join('')||'<p class=mu>No notifications.</p>'}</div>`};

V.admin=()=>{AF=()=>{};const ok=D.orders.filter(o=>o.status!='Cancelled');return`${hd('Admin Panel')}<div class=g>${[['Users',D.users.length],['Products',D.products.length],['All orders',D.orders.length],['Total revenue',inr(ok.filter(o=>o.pay=='Paid').reduce((a,o)=>a+o.total,0))],['Messages',D.msgs.length]].map(s=>`<div class="card st"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div>

<div class="g g2"><div class=card><h3 style="margin-top:0">System settings</h3><form onsubmit="return A.set(event)"><label>Store name</label><input name=store value="${esc(D.set.store)}" required><label>GST %</label><input name=tax type=number min=0 max=28 step=0.5 value=${D.set.tax}><label>Low-stock threshold</label><input name=low type=number min=0 value=${D.set.low}><br><br><button class=btn>Save settings</button></form></div><div class=card><h3 style="margin-top:0">Broadcast notification</h3><form onsubmit="return A.bc(event)"><textarea name=msg rows=3 required minlength=5 placeholder="Message to all users"></textarea><br><br><button class=btn>Send to all</button></form></div></div>
<div class="g g2"><div class=card><h3 style="margin-top:0">All transactions</h3><div class=w><table>${[...D.orders].reverse().slice(0,8).map(o=>`<tr><td>${o.id}<td>${inr(o.total)}<td>${tg(o.pay)}<td>${tg(o.status)}</tr>`).join('')}</table></div><a href="#orders">View all orders</a> · <a href="#reports">Reports</a></div><div class=card><h3 style="margin-top:0">Activity monitor</h3>${D.logs.slice(0,10).map(l=>`<p class=sm style="margin:3px 0"><b>${esc(l.u)}</b> – ${esc(l.a)} <span class=mu>${l.t}</span></p>`).join('')}</div></div>`};
